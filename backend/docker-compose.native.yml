version: "3"

services:
  backend:
    image: arknights-gacha-recorder:native-local
    build:
      context: .
      dockerfile: Dockerfile.runtime
    environment:
      - DATABASE_URL=postgresql://127.0.0.1:5432/postgres
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - TZ=Asia/Shanghai
      - PORT=18080
      - OPEN_LOOP=false
      - AGENT_KEY=7749
    network_mode: host
